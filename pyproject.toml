[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mada-rag"
version = "0.1.0"
description = "A source-bounded multilingual RAG system for one revision of Wikipedia's Madagascar page."
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Memphis Fils" }]
dependencies = [
  "beautifulsoup4>=4.12.3,<5",
  "faiss-cpu>=1.9,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "rank-bm25>=0.2.2,<0.3",
  "sentence-transformers>=3.3,<6",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
mada-rag = "mada_rag.cli:app"

[project.optional-dependencies]
openai = ["openai>=1.59,<3"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-beautifulsoup4>=4.12.0.20241020",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mada_rag"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["mada_rag"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["faiss", "rank_bm25", "sentence_transformers.*"]
ignore_missing_imports = true
